<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Pegatina QR · San Telmo</title>
  <style>
    /* Pegatina de 8 × 8 cm. En pantalla se ve con marco; al imprimir ocupa
       exactamente una hoja de 80 × 80 mm, sin márgenes. */
    @page { size: 80mm 80mm; margin: 0; }

    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: #dfe5ec;
      color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 24px 16px;
    }

    .controls { text-align: center; max-width: 360px; font-size: 15px; line-height: 1.4; }
    .controls button {
      margin-top: 8px; min-height: 48px; padding: 0 22px;
      font: inherit; font-weight: 700; color: #fff; background: #12283d;
      border: 0; border-radius: 12px; cursor: pointer;
    }
    .warn {
      margin: 0 0 8px; padding: 8px 10px; border-radius: 8px;
      background: #fff0bd; color: #6a4600; border: 1px solid #d9a300; font-weight: 600;
    }

    .sticker {
      width: 80mm; height: 80mm;
      padding: 3mm 3mm 2.5mm;
      background: #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      text-align: center;
      box-shadow: 0 2px 10px rgba(0, 0, 0, .3);
      overflow: hidden;
    }
    .brand { font-size: 19pt; font-weight: 800; line-height: 1; letter-spacing: .2pt; }
    .qr { width: 41mm; height: 41mm; display: flex; align-items: center; justify-content: center; }
    .qr svg { width: 100%; height: 100%; display: block; }
    .qr-missing {
      width: 100%; height: 100%; border: .4mm dashed #000; padding: 2mm;
      display: flex; align-items: center; justify-content: center;
      font-size: 9pt; font-weight: 700; line-height: 1.2;
    }
    .lines { line-height: 1.15; }
    .lines p { margin: 0; font-size: 8.5pt; }
    .lines p:first-child { font-size: 10.5pt; font-weight: 700; }

    @media print {
      body { background: #fff; padding: 0; gap: 0; min-height: 0; display: block; }
      .controls { display: none; }
      .sticker { box-shadow: none; break-inside: avoid; page-break-after: avoid; }
    }
  </style>
</head>
<body>

<div class="controls" id="controls">
  <div class="warn" id="warn" hidden></div>
  <div id="help">Pegatina de 8 × 8 cm. En «Imprimir», ponga la escala al 100 % y sin márgenes.</div>
  <button type="button" id="print">Imprimir</button>
</div>

<main class="sticker" id="sticker">
  <div class="brand" id="brand"></div>
  <div class="qr" id="qr"></div>
  <div class="lines" id="lines"></div>
</main>

<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="qr.js"></script>
<script>
(function () {
  "use strict";
  var CFG = window.SANTELMO_CONFIG, T = window.SANTELMO_I18N;
  var url = (CFG.publicUrl || "").trim();

  document.getElementById("brand").textContent = T.es.sticker.brand;

  var lines = document.getElementById("lines");
  ["es", "en", "de"].forEach(function (code) {
    var p = document.createElement("p");
    p.textContent = T[code].sticker.title;
    p.lang = code;
    lines.appendChild(p);
  });

  var box = document.getElementById("qr");
  if (url) {
    box.innerHTML = QR.svg(url, { border: 4 });
  } else {
    var miss = document.createElement("div");
    miss.className = "qr-missing";
    miss.textContent = "POR CONFIRMAR: URL pública (config.js)";
    box.appendChild(miss);
    var warn = document.getElementById("warn");
    warn.textContent = "POR CONFIRMAR: falta la URL pública en config.js. No imprima la pegatina todavía.";
    warn.hidden = false;
    console.warn("[San Telmo] POR CONFIRMAR: falta publicUrl en config.js; el QR no se genera.");
  }

  document.getElementById("print").addEventListener("click", function () { window.print(); });
})();
</script>
</body>
</html>
