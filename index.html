<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b1b2b">
  <title>San Telmo Servicios</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Iconos (sin dependencias): se usan con <svg class="i"><use href="#i-..."></use></svg> -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4.6A8 8 0 1 1 21 12z"/><path d="M9 9.5c.3 2 2.5 4.2 5 5l1.3-1.3-1.8-1-.8.7a4 4 0 0 1-1.6-1.6l.7-.8-1-1.8z"/></symbol>
    <symbol id="i-plane" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></symbol>
    <symbol id="i-mountain" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 3 4 8 5-5 5 15H2L8 3z"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>
    <symbol id="i-card" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></symbol>
    <symbol id="i-seats" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v8a3 3 0 0 0 3 3h7M7 14v7M17 14v7M10 17h7"/></symbol>
    <symbol id="i-access" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4" r="1.5"/><path d="M12 7v6h5l2 6M12 10h4M8.5 11.5A5.5 5.5 0 1 0 15 19"/></symbol>
    <symbol id="i-car" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17H3v-4l2-5.5A2 2 0 0 1 7 6h10a2 2 0 0 1 2 1.5L21 13v4h-2M3 13h18M9 17h6"/><circle cx="7.5" cy="17" r="1.8"/><circle cx="16.5" cy="17" r="1.8"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></symbol>
    <symbol id="i-wrench" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></symbol>
    <symbol id="i-fuel" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 22h12M4 9h10M14 22V4a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v18M14 13h2a2 2 0 0 1 2 2v2a2 2 0 0 0 2 2 2 2 0 0 0 2-2V9.83a2 2 0 0 0-.59-1.42L18 5"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></symbol>
    <!-- Paisaje de las tarjetas de ruta (sustituye a la foto hasta tener las del cliente) -->
    <symbol id="art-land" viewBox="0 0 300 120" preserveAspectRatio="none">
      <path d="M0 120V78l40-26 36 22 52-44 60 50 40-24 72 40v44z" fill="currentColor" opacity=".35"/>
      <path d="M0 120V96l56-28 44 24 62-38 54 40 84-22v48z" fill="currentColor" opacity=".6"/>
      <path d="M0 120v-12l70-14 60 12 70-16 100 14v16z" fill="currentColor"/>
    </symbol>
  </defs>
</svg>

<!-- ======================= Cabecera fija ======================= -->
<header class="top" id="top">
  <div class="wrap top-in">
    <a class="logo" href="#ahora" aria-label="San Telmo Servicios">
      <span class="logo-mark" aria-hidden="true">TAXI</span>
      <span class="logo-txt">
        <strong>San Telmo</strong>
        <small data-i="tagline"></small>
      </span>
    </a>

    <nav class="links" aria-label="Menú">
      <a href="#servicios" data-i="navServices"></a>
      <a href="#tarifas" data-i="navRates"></a>
      <a href="#rutas" data-i="navRoutes"></a>
      <a href="#reservar" data-i="navBook"></a>
      <a href="#taller" data-i="navShop"></a>
    </nav>

    <div class="top-tools">
      <div class="langs" role="group" data-i-aria="langLabel">
        <button type="button" data-lang="es" aria-pressed="true">ES</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
        <button type="button" data-lang="de" aria-pressed="false">DE</button>
      </div>
      <a class="nav-call" id="nav-call" href="#">
        <svg class="i" aria-hidden="true"><use href="#i-phone"/></svg>
        <span class="nav-call-txt" data-i="navCall"></span>
        <b id="nav-call-num"></b>
      </a>
    </div>
  </div>
</header>

<main>

  <!-- ======================= Portada: pedir taxi ahora ======================= -->
  <section class="hero" id="ahora" aria-labelledby="t-hero">
    <div class="wrap hero-in">
      <p class="eyebrow hero-eyebrow"><span class="dot" aria-hidden="true"></span><span data-i="heroEyebrow"></span></p>
      <h1 id="t-hero" class="hero-title" data-i="heroTitle"></h1>

      <div class="now" role="group" aria-labelledby="t-now">
        <h2 id="t-now" class="now-title" data-i="nowTitle"></h2>
        <a class="btn btn-call" id="btn-call" href="#">
          <svg class="i i-lg" aria-hidden="true"><use href="#i-phone"/></svg>
          <span class="btn-txt">
            <span class="btn-main" data-i="callBtn"></span>
            <span class="btn-num" id="call-num"></span>
          </span>
        </a>
        <a class="btn btn-ghost" id="btn-app" href="#">
          <span data-i="appBtn"></span>
          <svg class="i" aria-hidden="true"><use href="#i-arrow"/></svg>
          <span class="tag tag-pending" id="app-tag" hidden></span>
        </a>
        <p class="small note" id="app-note" hidden></p>
      </div>

      <p class="hero-sub" data-i="heroSub"></p>

      <ul class="badges">
        <li><svg class="i" aria-hidden="true"><use href="#i-clock"/></svg><span data-i="badge24"></span></li>
        <li><svg class="i" aria-hidden="true"><use href="#i-card"/></svg><span data-i="badgeCard"></span></li>
        <li><svg class="i" aria-hidden="true"><use href="#i-seats"/></svg><span data-i="badgeSeats"></span></li>
        <li><svg class="i" aria-hidden="true"><use href="#i-access"/></svg><span data-i="badgeAdapted"></span></li>
      </ul>

      <div class="hero-art" aria-hidden="true">
        <span class="sun"></span>
        <svg viewBox="0 0 560 250" class="taxi-art" focusable="false">
          <defs>
            <pattern id="chk" width="16" height="16" patternUnits="userSpaceOnUse">
              <rect width="8" height="8" fill="#0b1b2b"/><rect x="8" y="8" width="8" height="8" fill="#0b1b2b"/>
            </pattern>
          </defs>
          <ellipse cx="282" cy="226" rx="236" ry="10" fill="rgba(0,0,0,.35)"/>
          <!-- cabina -->
          <path d="M150 120 L186 64 Q191 56 202 56 H350 Q362 56 370 65 L412 120 Z" fill="#fff"/>
          <path d="M170 114 L198 72 H268 V114 Z" fill="#a9cbe8"/>
          <path d="M280 72 H346 L380 114 H280 Z" fill="#a9cbe8"/>
          <!-- carrocería -->
          <path d="M58 152 Q58 120 90 118 L150 114 H420 L482 124 Q510 130 510 158 V192 H58 Z" fill="#fff"/>
          <rect x="58" y="150" width="452" height="16" fill="url(#chk)"/>
          <path d="M274 116 V190" stroke="#c9d3de" stroke-width="2"/>
          <rect x="248" y="130" width="18" height="5" rx="2.5" fill="#c9d3de"/>
          <rect x="288" y="130" width="18" height="5" rx="2.5" fill="#c9d3de"/>
          <!-- luces -->
          <rect x="496" y="136" width="14" height="12" rx="3" fill="#ffd24a"/>
          <rect x="58" y="136" width="9" height="14" rx="3" fill="#e5484d"/>
          <!-- rótulo del techo -->
          <rect x="266" y="54" width="20" height="6" fill="#0b1b2b"/>
          <rect x="232" y="34" width="86" height="24" rx="5" fill="#f6b800"/>
          <text x="275" y="52" text-anchor="middle" font-family="-apple-system, Arial, sans-serif" font-weight="800" font-size="16" letter-spacing="2" fill="#0b1b2b">TAXI</text>
          <!-- ruedas -->
          <circle cx="150" cy="194" r="40" fill="#0b1b2b"/>
          <circle cx="420" cy="194" r="40" fill="#0b1b2b"/>
          <circle cx="150" cy="194" r="31" fill="#24303d"/>
          <circle cx="420" cy="194" r="31" fill="#24303d"/>
          <circle cx="150" cy="194" r="14" fill="#cfd8e2"/>
          <circle cx="420" cy="194" r="14" fill="#cfd8e2"/>
          <circle cx="150" cy="194" r="5" fill="#8fa0b2"/>
          <circle cx="420" cy="194" r="5" fill="#8fa0b2"/>
        </svg>
      </div>
    </div>
    <div class="checker" aria-hidden="true"></div>
  </section>

  <!-- ======================= Servicios de taxi ======================= -->
  <section class="section" id="servicios" aria-labelledby="t-serv">
    <div class="wrap">
      <header class="sec-head">
        <h2 id="t-serv" data-i="servicesTitle"></h2>
      </header>
      <div class="two">
        <ul class="svc-grid" id="services-list"></ul>
        <div class="fleet">
          <div class="foto foto-wide" role="img">
            <svg class="i i-xl" aria-hidden="true"><use href="#i-car"/></svg>
            <span class="foto-label" data-i="photoFleet"></span>
          </div>
          <h3 data-i="fleetTitle"></h3>
          <ul class="chips" id="fleet-list"></ul>
        </div>
      </div>
    </div>
  </section>

  <!-- ======================= Tarifas ======================= -->
  <section class="section section-dark" id="tarifas" aria-labelledby="t-rates">
    <div class="wrap">
      <header class="sec-head">
        <h2 id="t-rates" data-i="ratesTitle"></h2>
      </header>
      <div class="rates">
        <div class="rate">
          <svg class="i i-lg" aria-hidden="true"><use href="#i-plane"/></svg>
          <span class="rate-route" data-i="rateNorth"></span>
          <strong class="rate-price"><small data-i="from"></small> 30 €</strong>
        </div>
        <div class="rate">
          <svg class="i i-lg" aria-hidden="true"><use href="#i-plane"/></svg>
          <span class="rate-route" data-i="rateSouth"></span>
          <strong class="rate-price"><small data-i="from"></small> 100 €</strong>
        </div>
      </div>
      <p class="notice" data-i="ratesNotice"></p>
    </div>
  </section>

  <!-- ======================= Rutas turísticas ======================= -->
  <section class="section" id="rutas" aria-labelledby="t-routes">
    <div class="wrap">
      <header class="sec-head">
        <h2 id="t-routes" data-i="routesTitle"></h2>
        <p class="lead" data-i="routesIntro"></p>
        <p class="small note" data-i="routesSample"></p>
      </header>
      <div class="routes" id="routes-list"></div>
    </div>
  </section>

  <!-- ======================= Reservar para otro día ======================= -->
  <section class="section section-tint" id="reservar" aria-labelledby="t-book">
    <div class="wrap book">
      <div class="book-side">
        <h2 id="t-book" data-i="bookTitle"></h2>
        <p class="lead" data-i="bookIntro"></p>
        <ol class="steps">
          <li><span class="step-n">1</span><span data-i="step1"></span></li>
          <li><span class="step-n">2</span><span data-i="step2"></span></li>
          <li><span class="step-n">3</span><span data-i="step3"></span></li>
        </ol>
        <p class="small" data-i="bookNote"></p>
      </div>

      <form id="form-reserva" class="panel" novalidate autocomplete="off">
        <label class="field">
          <span data-i="fService"></span>
          <select id="f-service" name="service" data-req="fService"></select>
        </label>

        <div class="row2 row2-wide">
          <label class="field">
            <span data-i="fPickup"></span>
            <input type="text" id="f-pickup" name="pickup" data-req="fPickup" data-i-ph="phPickup">
          </label>
          <label class="field">
            <span data-i="fDropoff"></span>
            <input type="text" id="f-dropoff" name="dropoff" data-req="fDropoff" data-i-ph="phDropoff">
          </label>
        </div>

        <div class="row2">
          <label class="field">
            <span data-i="fDate"></span>
            <input type="date" id="f-date" name="date" data-req="fDate">
          </label>
          <label class="field">
            <span data-i="fTime"></span>
            <input type="time" id="f-time" name="time" data-req="fTime">
          </label>
        </div>

        <div class="row2">
          <label class="field">
            <span data-i="fPeople"></span>
            <input type="number" id="f-people" name="people" min="1" step="1" inputmode="numeric" value="2" data-req="fPeople">
          </label>
          <label class="field">
            <span data-i="fBags"></span>
            <input type="number" id="f-bags" name="bags" min="0" step="1" inputmode="numeric" value="0">
          </label>
        </div>

        <label class="field" id="flight-field" hidden>
          <span data-i="fFlight"></span>
          <input type="text" id="f-flight" name="flight" data-i-ph="phFlight" autocapitalize="characters">
        </label>

        <fieldset class="field extras">
          <legend data-i="fExtras"></legend>
          <label class="check"><input type="checkbox" name="extras" value="seat"><span data-i="extras.seat"></span></label>
          <label class="check"><input type="checkbox" name="extras" value="adapted"><span data-i="extras.adapted"></span></label>
          <label class="check"><input type="checkbox" name="extras" value="large"><span data-i="extras.large"></span></label>
        </fieldset>

        <div class="row2 row2-wide">
          <label class="field">
            <span data-i="fName"></span>
            <input type="text" id="f-name" name="name" data-req="fName" autocomplete="name">
          </label>
          <label class="field">
            <span data-i="fPhone"></span>
            <input type="tel" id="f-phone" name="phone" data-req="fPhone" data-i-ph="phPhone" autocomplete="tel">
          </label>
        </div>

        <label class="field">
          <span data-i="fComments"></span>
          <textarea id="f-comments" name="comments" rows="3" data-i-ph="phComments"></textarea>
        </label>

        <button type="submit" class="btn btn-wa">
          <svg class="i" aria-hidden="true"><use href="#i-chat"/></svg>
          <span data-i="submit"></span>
        </button>
        <p class="small status" id="form-status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </section>

  <!-- ======================= Preguntas frecuentes ======================= -->
  <section class="section" id="faq" aria-labelledby="t-faq">
    <div class="wrap">
      <header class="sec-head">
        <h2 id="t-faq" data-i="faqTitle"></h2>
      </header>
      <div class="faq-list" id="faq-list"></div>
    </div>
  </section>

  <!-- ======================= Así le llega a la central ======================= -->
  <section class="section section-dark" id="central" aria-labelledby="t-central">
    <div class="wrap central">
      <div class="central-text">
        <h2 id="t-central" data-i="centralTitle"></h2>
        <dl class="qa" id="central-qa"></dl>
        <p class="lead strong" data-i="centralLine"></p>
      </div>

      <div class="central-demo">
        <p class="small cap" data-i="centralExample"></p>
        <div class="phone">
          <div class="phone-top">
            <span class="avatar" aria-hidden="true">ST</span>
            <span class="phone-name"><b data-i="waChatName"></b><small>WhatsApp</small></span>
          </div>
          <div class="phone-body">
            <div class="wa-bubble" id="wa-example" translate="no" lang="es"></div>
          </div>
        </div>
        <p class="small cap" data-i="centralSpanish"></p>
      </div>
    </div>
  </section>

  <!-- ======================= Taller y gasolineras ======================= -->
  <section class="section" id="taller" aria-labelledby="t-shop">
    <div class="wrap">
      <header class="sec-head">
        <h2 id="t-shop" data-i="shopTitle"></h2>
      </header>

      <div class="shop">
        <div class="shop-cards">
          <article class="mini">
            <h3><svg class="i" aria-hidden="true"><use href="#i-clock"/></svg><span data-i="hoursTitle"></span></h3>
            <ul class="list">
              <li data-i="hoursTaxi"></li>
              <li data-i="hoursStations"></li>
              <li data-i="hoursWorkshop"></li>
            </ul>
          </article>

          <article class="mini">
            <h3><svg class="i" aria-hidden="true"><use href="#i-wrench"/></svg><span data-i="workshopName"></span></h3>
            <p data-i="workshopServices"></p>
            <p data-i="workshopTaxis"></p>
          </article>

          <article class="mini">
            <h3><svg class="i" aria-hidden="true"><use href="#i-fuel"/></svg><span data-i="stationsName"></span></h3>
            <p data-i="stationsServices"></p>
            <ul class="list">
              <li><strong data-i="stationTrompo"></strong><br><span id="trompo-addr"></span></li>
              <li><strong data-i="stationLasArenas"></strong><br>
                <span class="tag tag-pending" data-i="pending"></span>
                <span class="small" data-i="stationLasArenasNote"></span></li>
            </ul>
          </article>
        </div>

        <div class="shop-side">
          <div class="phones">
            <a class="btn btn-ghost" id="tel-workshop" href="#"><span data-i="phoneWorkshop"></span><span class="btn-num" id="tel-workshop-num"></span></a>
            <a class="btn btn-ghost" id="tel-trompo" href="#"><span data-i="stationTrompo"></span><span class="btn-num" id="tel-trompo-num"></span></a>
            <a class="btn btn-ghost" id="tel-general" href="#"><span data-i="phoneGeneral"></span><span class="btn-num" id="tel-general-num"></span></a>
          </div>

          <form id="form-cita" class="panel" novalidate autocomplete="off">
            <h3 data-i="apptTitle"></h3>
            <label class="field">
              <span data-i="fPlate"></span>
              <input type="text" id="c-plate" name="plate" data-req="fPlate" autocapitalize="characters">
            </label>
            <label class="field">
              <span data-i="fNeed"></span>
              <input type="text" id="c-need" name="need" data-req="fNeed" data-i-ph="phNeed">
            </label>
            <label class="field">
              <span data-i="fDay"></span>
              <input type="text" id="c-day" name="day" data-req="fDay" data-i-ph="phDay">
            </label>
            <button type="submit" class="btn btn-wa">
              <svg class="i" aria-hidden="true"><use href="#i-chat"/></svg>
              <span data-i="apptBtn"></span>
            </button>
            <p class="small status" id="cita-status" role="status" aria-live="polite"></p>
          </form>
        </div>
      </div>
    </div>
  </section>

</main>

<!-- ======================= Pie ======================= -->
<footer class="foot">
  <div class="wrap foot-in">
    <div class="foot-brand">
      <span class="logo-mark" aria-hidden="true">TAXI</span>
      <strong>San Telmo Servicios</strong>
    </div>
    <p class="foot-addr">
      <svg class="i" aria-hidden="true"><use href="#i-pin"/></svg>
      <span><strong data-i="footAddress"></strong><br><span id="foot-address"></span><br>
      <a id="foot-map" href="#" target="_blank" rel="noopener"><span data-i="footMap"></span></a></span>
    </p>
    <p class="disclaimer" data-i="footDisclaimer"></p>
  </div>
</footer>

<!-- Barra fija (móvil): Llamar · WhatsApp · Reservar -->
<nav class="bar" aria-label="Acciones rápidas">
  <a class="bar-call" id="bar-call" href="#"><svg class="i" aria-hidden="true"><use href="#i-phone"/></svg><span data-i="barCall"></span></a>
  <a class="bar-wa" id="bar-wa" href="#"><svg class="i" aria-hidden="true"><use href="#i-chat"/></svg><span data-i="barWa"></span></a>
